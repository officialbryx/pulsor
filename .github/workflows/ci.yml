name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project (with dev dependencies)
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check app ml tests scripts

      - name: Test
        run: pytest -v

      - name: Build Docker image
        run: docker build -t fraudpulse:ci .
