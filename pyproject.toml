[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudpulse"
version = "1.0.0"
description = "Real-time payment transaction anomaly detection API for fintech teams"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.45",
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
pulsor-train = "ml.train:main"

[tool.setuptools.packages.find]
include = ["app*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

