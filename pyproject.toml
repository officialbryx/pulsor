[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudpulse"
version = "0.1.0"
description = "Real-time transaction anomaly detection API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<0.120",
    "httpx>=0.27",
    "uvicorn[standard]>=0.27",
    "scikit-learn>=1.4",
    "xgboost>=2.0,<3.1",
    "shap>=0.45",
    "pydantic>=2.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
